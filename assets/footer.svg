
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset="0.6" stop-color="#302b63"/><stop offset="1" stop-color="#ff3cac"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="280" fill="url(#sky)" rx="14"/>

  <!-- twinkling stars -->
  <g fill="#fff">
    <rect x="60" y="30" width="4" height="4"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="180" y="70" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="320" y="25" width="4" height="4"><animate attributeName="opacity" values="1;0.1;1" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="560" y="40" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="720" y="20" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="840" y="75" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- HUD -->
  <text x="24" y="34" fill="#fff" font-size="14" font-weight="bold">1UP  <tspan fill="#ffe600">000420</tspan></text>
  <text x="450" y="34" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">HI-SCORE  <tspan fill="#00ffd5">999999</tspan></text>
  <text x="876" y="34" fill="#ff5c5c" font-size="14" font-weight="bold" text-anchor="end">LIVES x3</text>

  <!-- title -->
  <text x="450" y="115" text-anchor="middle" font-size="46" font-weight="bold" fill="#00ffd5" filter="url(#glow)" letter-spacing="3">NAING MOE KHANT</text>
  <text x="450" y="148" text-anchor="middle" font-size="18" fill="#ffe600" letter-spacing="4">PLAYER 1  *  FULL-STACK DEVELOPER</text>
  <text x="450" y="182" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">
    PRESS START
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </text>

  <!-- floor -->
  <rect x="0" y="228" width="900" height="52" fill="#1b1340"/>
  <g stroke="#ff3cac" stroke-width="2" opacity="0.7">
    <line x1="0" y1="228" x2="900" y2="228"/>
    <line x1="0" y1="246" x2="900" y2="246" opacity="0.5"/>
    <line x1="0" y1="266" x2="900" y2="266" opacity="0.3"/>
  </g>

  <!-- coins -->
  <g fill="#ffe600" stroke="#b38f00" stroke-width="2">
    <rect x="200" y="196" width="14" height="18" rx="4"><animate attributeName="width" values="14;4;14" dur="1s" repeatCount="indefinite"/><animate attributeName="x" values="200;205;200" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="420" y="196" width="14" height="18" rx="4"><animate attributeName="width" values="14;4;14" dur="1s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="x" values="420;425;420" dur="1s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="640" y="196" width="14" height="18" rx="4"><animate attributeName="width" values="14;4;14" dur="1s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="x" values="640;645;640" dur="1s" begin="0.6s" repeatCount="indefinite"/></rect>
  </g>

  <!-- running pixel hero (original sprite) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-80 0; 960 0" dur="9s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.35s" repeatCount="indefinite"/>
      <g transform="translate(0,174)" shape-rendering="crispEdges">
        <rect x="12" y="0"  width="36" height="6" fill="#ff3c3c"/>
        <rect x="6"  y="6"  width="48" height="6" fill="#ff3c3c"/>
        <rect x="12" y="12" width="36" height="18" fill="#ffcf9f"/>
        <rect x="18" y="18" width="6" height="6" fill="#222"/>
        <rect x="36" y="18" width="6" height="6" fill="#222"/>
        <rect x="6"  y="30" width="48" height="12" fill="#3c7bff"/>
        <rect x="12" y="42" width="36" height="6" fill="#3c7bff"/>
        <rect x="12" y="48" width="12" height="6" fill="#5b3a29"><animate attributeName="x" values="12;6;12" dur="0.35s" repeatCount="indefinite"/></rect>
        <rect x="36" y="48" width="12" height="6" fill="#5b3a29"><animate attributeName="x" values="36;42;36" dur="0.35s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
